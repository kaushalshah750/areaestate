<div class="bg-acc w-100 vh-100">
    <div class="p-4">
        <form class="bg-white border p-4 br20">
            <div class="d-grid grid-1-1-1 gap-10">
                <div class="form-group mb-3">
                    <label for="fname" class="poppins-medium">First Name</label>
                    <input type="text" class="form-control mt-1 br20" name="fname" id="fname" [(ngModel)]="fname">
                </div>
                <div class="form-group mb-3">
                    <label for="lname" class="poppins-medium">Last Name</label>
                    <input type="text" class="form-control mt-1" name="lname" id="lname" [(ngModel)]="lname">
                </div>
                <div class="form-group mb-3">
                    <label for="Phone" class="poppins-medium">Phone</label>
                    <div class="input-group mt-1">
                        <div class="input-group-prepend">
                            <div class="input-group-text">+91</div>
                        </div>
                        <input type="text" class="form-control" name="Phone" id="Phone" [(ngModel)]="phone">
                    </div>
                </div>
                <div class="form-group">
                    <label for="Mobile" class="poppins-medium">Mobile</label>
                    <div class="input-group mt-1">
                        <div class="input-group-prepend">
                            <div class="input-group-text">+91</div>
                        </div>
                        <input type="text" class="form-control" name="Mobile" id="Mobile" [(ngModel)]="mobile">
                    </div>
                </div>
                <div class="form-group">
                    <label for="Email" class="poppins-medium">Email</label>
                    <input type="text" class="form-control mt-1" name="Email" id="Email" [(ngModel)]="email">
                </div>
                <div class="form-group">
                    <label for="gender" class="poppins-medium">Gender</label>
                    <select class="custom-select form-control mt-1" name="gender" id="gender" [(ngModel)]="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                    </select>
                </div>
                <div class="form-group my-3">
                    <label for="joiningdate" class="poppins-medium">Joining Date</label>
                    <input type="date" class="form-control mt-1" name="joiningdate" id="joiningdate" [(ngModel)]="joiningdate">
                </div>
                <div class="form-group my-3">
                    <label for="role" class="poppins-medium">Role</label>
                    <select class="form-control mt-1" name="role" id="role" [(ngModel)]="role">
                        <option value="{{role.Id}}" *ngFor="let role of roleData">{{role.Name}}</option>
                    </select>
                </div>
                <div class="form-group my-3">
                    <label for="dob" class="poppins-medium">Date of Birth</label>
                    <input type="date" class="form-control mt-1" name="dob" id="dob" [(ngModel)]="dob">
                </div>
            </div>
            <div class="form-group my-3">
                <label for="currentaddress" class="poppins-medium">Current Address</label>
                <textarea rows="4" class="form-control mt-1" name="currentaddress" id="currentaddress" [(ngModel)]="currentaddress"></textarea>
            </div>
            <div class="form-group my-3">
                <label for="permanentaddress" class="poppins-medium">Permanent Address</label>
                <textarea rows="4" class="form-control mt-1" name="permanentaddress" id="permanentaddress" [(ngModel)]="permanentaddress"></textarea>
            </div>
            <div class="d-grid grid-1-1 gap-10">
                <div class="form-group">
                    <label for="workinglocation" class="poppins-medium">Working Location</label>
                    <input type="text" class="form-control mt-1" name="workinglocation" id="workinglocation" [(ngModel)]="workinglocation">
                </div>
                <div class="form-group">
                    <label for="reportsto" class="poppins-medium">Reports To</label>
                    <input type="text" class="form-control mt-1" name="reportsto" id="reportsto" [(ngModel)]="reportsto">
                </div>
            </div>
            <div>
                <button type="submit" class="btn btn-pri mt-3 poppins-medium bg-pri px-5" style="margin-right: 10px;" (click)="submit()">Submit</button>
                <button type="submit" class="btn btn-secondary mt-3 poppins-medium bg-sec px-5">Cancel</button>
            </div>
        </form>
    </div>
</div>
