<div class="d-flex align-items-center justify-content-between border py-3 px-4">
    <h5 class="mb-0 poppins-medium">{{data ? "Update" : "Add"}} Employee</h5>
    <span class="material-symbols-outlined pointer" (click)="closeOverlay()">close</span>
</div>
<!-- <h2 mat-dialog-title class="d-flex align-items-center border">{{data ? "Update" : "Add"}} Employee</h2> -->
<mat-dialog-content class="py-4">
    <form [formGroup]="employeeForm">
        <div class="d-grid grid-1-1-1 gap-10">
            <div class="form-group mb-3">
                <label for="fname" class="poppins-medium">First Name</label>
                <input type="text" class="form-control mt-1 br20" name="fname" id="fname" formControlName="First_name">
            </div>
            <div class="form-group mb-3">
                <label for="lname" class="poppins-medium">Last Name</label>
                <input type="text" class="form-control mt-1" name="lname" id="lname" formControlName="Last_name">
            </div>
            <div class="form-group mb-3">
                <label for="Username" class="poppins-medium">Username</label>
                <input type="text" class="form-control mt-1" name="Username" id="Username" formControlName="Username">
            </div>
            <div class="form-group mb-3">
                <label for="Password" class="poppins-medium">Password</label>
                <input type="text" class="form-control mt-1" name="Password" id="Password" formControlName="Password">
            </div>
            <div class="form-group mb-3">
                <label for="Phone" class="poppins-medium">Phone</label>
                <div class="input-group mt-1">
                    <div class="input-group-prepend">
                        <div class="input-group-text">+91</div>
                    </div>
                    <input type="text" class="form-control" name="Phone" id="Phone" formControlName="Phone">
                </div>
            </div>
            <div class="form-group">
                <label for="Mobile" class="poppins-medium">Mobile</label>
                <div class="input-group mt-1">
                    <div class="input-group-prepend">
                        <div class="input-group-text">+91</div>
                    </div>
                    <input type="text" class="form-control" name="Mobile" id="Mobile" formControlName="Mobile">
                </div>
            </div>
            <div class="form-group">
                <label for="Email" class="poppins-medium">Email</label>
                <input type="text" class="form-control mt-1" name="Email" id="Email" formControlName="Email">
            </div>
            <div class="form-group">
                <label for="gender" class="poppins-medium">Gender</label>
                <select class="custom-select form-control mt-1" name="gender" id="gender" formControlName="Gender">
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                </select>
            </div>
            <div class="form-group">
                <label for="joiningdate" class="poppins-medium">Joining Date</label>
                <input type="date" class="form-control mt-1" name="joiningdate" id="joiningdate" formControlName="Joining_date">
            </div>
            <div class="form-group my-3">
                <label for="role" class="poppins-medium">Role</label>
                <select class="form-control mt-1" name="role" id="role" formControlName="Role_id">
                        <option value="{{role.Id}}" *ngFor="let role of roleData">{{role.Name}}</option>
                    </select>
            </div>
            <div class="form-group my-3">
                <label for="dob" class="poppins-medium">Date of Birth</label>
                <input type="date" class="form-control mt-1" name="dob" id="dob" formControlName="Dob">
            </div>
        </div>
        <div class="form-group my-3">
            <label for="currentaddress" class="poppins-medium">Current Address</label>
            <textarea rows="4" class="form-control mt-1" name="currentaddress" id="currentaddress" formControlName="Current_Address"></textarea>
        </div>
        <div class="form-group my-3">
            <label for="permanentaddress" class="poppins-medium">Permanent Address</label>
            <textarea rows="4" class="form-control mt-1" name="permanentaddress" id="permanentaddress" formControlName="Permanent_Address"></textarea>
        </div>
        <div class="d-grid grid-1-1 gap-10">
            <div class="form-group">
                <label for="workinglocation" class="poppins-medium">Working Location</label>
                <select class="form-control mt-1" name="workinglocation" id="workinglocation" formControlName="Working_location">
                        <option value="{{workingLocation.Id}}" *ngFor="let workingLocation of workingLocationData">{{workingLocation.Location}}</option>
                    </select>
                <!-- <input type="text" class="form-control mt-1" name="workinglocation" id="workinglocation" formControlName="workinglocation"> -->
            </div>
            <div class="form-group">
                <label for="reportsto" class="poppins-medium">Reports To</label>
                <input type="text" class="form-control mt-1" name="reportsto" id="reportsto" formControlName="Reports_to">
            </div>
        </div>
    </form>
</mat-dialog-content>
<mat-dialog-actions>
    <button type="submit" class="btn btn-primary poppins-medium px-4" style="margin-right: 10px;" (click)="submit()">Submit</button>
    <button type="submit" class="btn btn-secondary poppins-medium px-4" cdkFocusInitial [mat-dialog-close]>Cancel</button>
</mat-dialog-actions>
